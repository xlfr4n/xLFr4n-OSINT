name: Scheduled OSINT

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      all_sources:
        description: "Run every registered provider, including opt-in integrations"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Scheduled scan gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ vars.XLFR4N_OSINT_SCHEDULE_ENABLED }}" != "true" ]; then
            echo "Scheduled execution is disabled. Set repository variable XLFR4N_OSINT_SCHEDULE_ENABLED=true to enable it."
            exit 0
          fi

      - name: Run public-source batch
        shell: bash
        run: |
          mkdir -p reports
          if [ "${{ inputs.all_sources }}" = "true" ]; then
            python -m xlfr4n_osint batch examples/scheduled-public.jsonl --all-sources --output reports/scheduled.json --format json
          else
            python -m xlfr4n_osint batch examples/scheduled-public.jsonl --output reports/scheduled.json --format json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlfr4n-osint-report-${{ github.run_id }}
          path: reports/
          retention-days: 14
